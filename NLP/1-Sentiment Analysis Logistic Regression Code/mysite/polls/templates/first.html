{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentiment Analysis - AI Powered</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            margin: 0;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        .title {
            font-size: 2.5rem;
            font-weight: 700;
            color: #2d3748;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: #718096;
            font-size: 1.1rem;
            font-weight: 400;
            margin-bottom: 40px;
        }

        .form-group {
            margin-bottom: 30px;
        }

        .text-input {
            width: 100%;
            padding: 15px 20px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: white;
            color: #2d3748;
            box-sizing: border-box;
        }

        .text-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }

        .result-container {
            margin-top: 30px;
            padding: 25px;
            border-radius: 12px;
            background: #f7fafc;
            border-left: 4px solid #667eea;
        }

        .result-label {
            font-size: 0.9rem;
            color: #718096;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .result-text {
            font-size: 1.5rem;
            font-weight: 600;
            color: #2d3748;
        }

        .result-text.positive {
            color: #38a169;
        }

        .result-text.negative {
            color: #e53e3e;
        }

        .result-text.neutral {
            color: #3182ce;
        }

        .sentiment-icon {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        @media (max-width: 768px) {
            .container {
                padding: 30px 20px;
                margin: 10px;
            }
            
            .title {
                font-size: 2rem;
            }
            
            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 class="title">Sentiment Analysis</h1>
            <p class="subtitle">Discover the emotional tone behind your text</p>
        </div>
        
        <form method="post" action="{% url 'homepage' %}">
            {% csrf_token %}
            <div class="form-group">
                <input 
                    name="text_data" 
                    type="text" 
                    class="text-input" 
                    placeholder="Enter your text here..."
                    aria-label="Text for sentiment analysis"
                    required
                >
            </div>
            
            <button type="submit" name="pred_button" value="analyze" class="btn">
                Analyze Sentiment
            </button>
        </form>
        
        {% if result %}
        <div class="result-container">
            <div class="sentiment-icon">
                {% if "Positive" in result %}
                    😊
                {% elif "Negative" in result %}
                    😔
                {% else %}
                    😐
                {% endif %}
            </div>
            <div class="result-label">Analysis Result</div>
            <div class="result-text {% if "Positive" in result %}positive{% elif "Negative" in result %}negative{% else %}neutral{% endif %}">
                {{ result }}
            </div>
        </div>
        {% endif %}
    </div>
</body>
</html>
